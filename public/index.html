:root{
  --sage:#639685; --sage-deep:#557F71; --mist:#9CC4B4;
  --ink:#0D1814; --ink2:#15251E; --ink3:#21362C; --paper:#F1F5EE;
  --gold:#FFC531; --ember:#FF8A3D;
}
/* the font sits on a 9-unit grid: every size here is a multiple of 9px */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:"re2",ui-monospace,monospace;font-size:18px;line-height:27px;text-transform:uppercase;
  -webkit-font-smoothing:none;text-rendering:optimizeSpeed;-webkit-user-select:none;user-select:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit;text-transform:uppercase}
button{cursor:pointer;border:0;background:none;padding:0}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:576px;margin:0 auto;padding:0 12px 90px}
.mist{color:var(--mist)} .gold{color:var(--gold)} .ember{color:var(--ember)} .dim{color:#5f7a6e} .ink{color:var(--ink)}
.s9{font-size:9px;line-height:9px} .big{font-size:36px;line-height:36px} .mid{font-size:27px;line-height:27px}

header{padding:18px 0 9px;display:flex;justify-content:space-between;align-items:flex-end;gap:9px}
.word{font-size:36px;line-height:36px;margin:0;font-weight:400}
.word span{color:var(--mist)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink2);border-top:2px solid var(--ink3);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:576px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{padding:14px 0 13px;color:var(--mist);border-top:3px solid transparent;margin-top:-2px}
nav.tabs button[aria-selected="true"]{color:var(--paper);border-top-color:var(--gold)}
section[hidden]{display:none}

.band{background:var(--ink2);padding:12px;margin:0 0 9px}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:9px;margin:18px 0 9px}
.h h2{font-size:27px;line-height:27px;margin:0;font-weight:400}
.btn{background:var(--gold);color:var(--ink);padding:9px 14px;display:inline-block;text-align:center;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px),0 4px,4px 4px)}
.btn.ghost{background:var(--ink3);color:var(--paper)}
.btn.wide{display:block;width:100%}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:9px 14px;z-index:90;max-width:92vw;text-align:center}
.toast[hidden]{display:none}
.sq{display:inline-block;width:8px;height:8px;background:var(--ember);vertical-align:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
input.num{background:var(--ink);border:2px solid var(--ink3);padding:6px 9px;width:100px}
.bar{height:9px;background:var(--ink3)} .bar i{display:block;height:9px;background:var(--gold)}

/* a re:gen: frameless on its own ground, whole-number scale only */
.tile{display:inline-block;position:relative;vertical-align:top;line-height:0;flex:none}
.tile img{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;pointer-events:none}

/* ---------- the table ---------- */
body.ingame{overflow:hidden}
body.ingame .wrap,body.ingame nav.tabs{display:none}
#game{position:fixed;inset:0;display:none;flex-direction:column;background:var(--ink);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.ingame #game{display:flex}
#game .col{width:100%;max-width:576px;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}
.opp{display:flex;align-items:center;gap:9px;padding:9px 12px 6px}
.opp .who{display:flex;flex-direction:column}
.backs{display:flex;margin-left:auto}
.backs i{display:block;width:18px;height:27px;background:var(--ink3);border:2px solid var(--sage-deep);margin-left:-9px}
.backs i:first-child{margin-left:0}
.quit{color:#5f7a6e;padding:0 6px 0 0}
.piles{display:flex;gap:9px;padding:0 12px;overflow-x:auto;min-height:63px;align-items:flex-start;scrollbar-width:none}
.piles::-webkit-scrollbar{display:none}
.pileset{display:flex;flex-direction:column;align-items:flex-start;flex:none;max-width:96px}
.pileset .stack{position:relative;width:46px;height:46px}
.pileset .stack .tile{position:absolute;outline:2px solid var(--ink)}
.pileset .pts{color:var(--gold)}
.pileset .lbl{color:var(--mist);margin-top:3px;max-width:96px;overflow:hidden;white-space:nowrap;text-overflow:clip}
.pileset.fresh .stack{animation:pop .36s steps(3) both}
@keyframes pop{0%{transform:translateY(-12px)}}
.empty{color:#5f7a6e;align-self:center}
.felt{background:var(--sage);margin:6px 0;padding:12px 12px 9px;display:flex;flex-direction:column;gap:6px;position:relative;flex:1 1 auto;min-height:117px;justify-content:center}
.felt .lab{position:absolute;left:12px;right:12px;top:9px}
.felt .lab{color:var(--ink)}
.faceup{display:flex;gap:9px;align-items:flex-start}
.card{position:relative;flex:none;background:var(--ink);padding:4px 4px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:none}
.card .no{font-size:9px;line-height:13px;color:var(--paper);height:13px}
.card.big .no{font-size:18px;line-height:24px;height:24px}
.card .one{position:absolute;left:4px;top:4px;background:var(--gold);color:var(--ink);font-size:9px;line-height:9px;padding:1px 2px}
.card .want{position:absolute;right:4px;top:4px;width:8px;height:8px;background:var(--ember)}
.card.in{animation:deal .3s steps(3) both}
@keyframes deal{from{transform:translateY(-27px)}}
.card:hover{transform:translateY(-3px)}
.deck{flex:none;width:62px;height:71px;background:var(--ink3);border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--mist);box-shadow:3px 3px 0 var(--ink),6px 6px 0 var(--ink2)}
.deck:hover{transform:translateY(-3px)}
.deck b{font-weight:400;font-size:27px;line-height:27px;color:var(--paper)}
.felt.locked .card,.felt.locked .deck{opacity:.55;cursor:default}
.felt.locked .card:hover,.felt.locked .deck:hover{transform:none}
.dock{display:flex;flex-direction:column;gap:6px;padding:6px 0 9px}
.msg{padding:0 12px;min-height:54px}
.chips{display:flex;gap:6px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--gold);color:var(--ink);padding:6px 9px;font-size:18px;line-height:18px;
  clip-path:polygon(3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px),0 3px,3px 3px)}
.chip.ghost{background:var(--ink3);color:var(--paper)}
.chip small{font-size:9px;line-height:9px;display:block;margin-top:3px}
.hand{position:relative;height:126px;margin:0 12px}
.hand .card{position:absolute;bottom:0;box-shadow:-3px 0 0 var(--ink2)}
.hand .card.big{padding:5px 5px 0}
.hand .card.sel{bottom:18px;outline:3px solid var(--gold);outline-offset:0}
.hand .card.hint .no{color:var(--gold)}
.hand .card.drop{outline:3px solid var(--ember)}
.score2{display:flex;align-items:baseline;gap:9px}
.score2 b{font-weight:400;font-size:27px;line-height:27px}
.turnlight{display:inline-block;width:8px;height:8px;background:var(--gold);margin-right:6px;vertical-align:3px}

/* zoom + sheets */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(13,24,20,.88);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{background:var(--ink);width:100%;max-width:576px;max-height:92vh;overflow:auto;padding:18px 14px calc(27px + env(safe-area-inset-bottom));border-top:3px solid var(--ink3)}
.sheet.up .in{animation:up .24s steps(4) both}
@keyframes up{from{transform:translateY(54px)}}
table.t{width:100%;border-collapse:collapse}
table.t td{padding:3px 6px 3px 0;border-top:2px solid var(--ink3);vertical-align:top}
table.t tr:first-child td{border-top:0}
table.t td:last-child{text-align:right;white-space:nowrap}
.lore p{margin:0 0 18px}
.lore ol{padding-left:27px;margin:0 0 18px} .lore li{margin-bottom:9px}
.wallgrid{display:flex;flex-wrap:wrap;gap:3px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge{background:var(--ink2);padding:9px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-height:117px}
.badge.off{opacity:.35}
.badge .art{display:flex;gap:3px}
.badge .none{width:36px;height:36px;background:var(--ink3)}
.chal{display:grid;grid-template-columns:1fr auto;gap:6px 9px;padding:9px 0;border-top:2px solid var(--ink3)}
.chal:first-child{border-top:0}
.chal .bar{grid-column:1/-1}
.chal.done{color:var(--gold)}
.board-row{display:grid;grid-template-columns:36px 36px 1fr auto;gap:9px;align-items:center;padding:6px 0;border-top:2px solid var(--ink3)}
.board-row:first-child{border-top:0}
.board-row.me{color:var(--gold)}
.seg{display:flex;gap:6px;margin:0 0 9px}
.seg button{padding:6px 9px;background:var(--ink2);color:var(--mist)}
.seg button.on{background:var(--paper);color:var(--ink)}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:27px;background:var(--gold);color:var(--ink);padding:0 6px}
</style>
</head>

<script>
/* =====================================================================
   re:collect — rules engine
   Every card is a real re:gen. The data is the collection's own trait list:
   { types[12], values[12][], counts[12][], tokens: 12 chars per re:gen }
   '.' = no trait in that slot; a letter = index into values[slot].
   ===================================================================== */
(function (root) {
'use strict';

/* ---------- rng ---------- */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function shuffle(a, R) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- the collection ---------- */
const CH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const SLOTS = 12;
let D = null;                 // the raw data
let N = 0;                    // how many re:gens
let TR = null;                // TR[n] = [key, key, ...] for re:gen #n (playable traits only)
let ALL = null;               // ALL[n] = [[slot, valueIndex], ...] every trait, for the card face
let ARTIST = null;            // ARTIST[n] = handle for a 1 of 1
let BY_KEY = null;            // key -> [n, ...]
const key = (t, v) => t * 64 + v;
const slotOf = k => k >> 6, valOf = k => k & 63;
function init(data) {
  D = data; N = Math.floor(data.tokens.length / SLOTS);
  TR = new Array(N + 1); ALL = new Array(N + 1); ARTIST = {}; BY_KEY = new Map();
  const tArtist = data.types.indexOf('artist'), tBg = data.types.indexOf('background');
  for (let n = 1; n <= N; n++) {
    const s = data.tokens.substr((n - 1) * SLOTS, SLOTS), all = [], play = [];
    for (let t = 0; t < SLOTS; t++) {
      const ch = s[t]; if (ch === '.') continue;
      const v = CH.indexOf(ch); if (v < 0) continue;
      all.push([t, v]);
      if (t === tArtist) { ARTIST[n] = data.values[t][v]; continue; }
      const name = data.values[t][v];
      if (name === 'none') continue;                               // "no drip" isn't something you can collect
      if (t === tBg && data.counts[t][v] > N / 2) continue;         // everybody stands on g(re:)en; only punk ground counts
      const k = key(t, v); play.push(k);
      if (!BY_KEY.has(k)) BY_KEY.set(k, []);
      BY_KEY.get(k).push(n);
    }
    TR[n] = play; ALL[n] = all;
  }
  return { N, oneOfOnes: Object.keys(ARTIST).length };
}
const count = k => D.counts[slotOf(k)][valOf(k)];
const slotName = t => D.types[t];
const valueName = (t, v) => { const s = D.values[t][v].replace(/_/g, ' '); return D.types[t] === 'type' && /^\d$/.test(s) ? 'type ' + s : s; };
const label = k => valueName(slotOf(k), valOf(k));
const kind = k => slotName(slotOf(k));

const G = { g: null, level: 'easy', sel: new Set(), taken: 0, laid: false, discard: 0, busy: false, msg: '', fresh: new Set(), freshOpp: new Set(), opp: 1, seen: new Set(), quitArm: 0 };

const me = () => G.g.players[ME], them = () => G.g.players[HOUSE];

function renderGame() {

  const hintCards = new Set(sugg.flatMap(x => x.cards));

function lay(k, cards) {

/* ---------- after a game: xp, the week, badges ---------- */
function endGame() {
  const g = G.g, p = me(), sharp = G.level === 'sharp', win = g.winner === ME;

  for (const n of p.collected) if (!S.wall[n]) S.wall[n] = S.games + 1;
  S.games++;
  if (win) { S.record.w++; S.streak = (S.streak | 0) + 1; } else { if (g.winner === HOUSE) S.record.l++; else S.record.d++; S.streak = 0; }
  S.best = Math.max(S.best, p.score);
  const sum = {
    win, sharp, score: p.score, newWall: fresh.length,
    maxSet: Math.max(0, ...p.sets.map(s => s.cards.length)),
    wanted: p.collected.filter(n => g.mods.wanted.has(n)).length,
    featSets: p.sets.filter(s => RC.slotOf(s.k) === g.mods.feature).length,

  };

  const lines = [`game: +${Math.max(0, p.score)}`, `${win ? 'win' : 'played'}: +${win ? (sharp ? 40 : 20) : 5}`];
  if (fresh.length) lines.push(`new on wall: +${fresh.length}`);
  // the week

  wk.games++; if (win) wk.wins++;
  for (const c of W.chals) {
    if (wk.done.includes(c.id)) continue;
    wk.prog[c.id] = Math.min(c.target, (wk.prog[c.id] || 0) + c.add(sum));

  { const s = setWith(s => RC.kind(s.k) === 'eyes' && RC.label(s.k) === 'lasers'); if (s) give('lasers', s.cards[0]); }
  { const n = p.collected.find(RC.isOne); if (n) give('one', n); }

/* =====================================================================
   LOOKING CLOSER: a card, a set
   ===================================================================== */
function openCard(n) {
  const mods = G.g ? G.g.mods : { feature: W.slot, wanted: new Set(W.wanted) };
  const rows = RC.allTraits(n).filter(([t, v]) => RC.D.values[t][v] !== 'none' && !(RC.slotName(t) === 'background' && RC.D.counts[t][v] > RC.N / 2)).map(([t, v]) => {
    const name = RC.valueName(t, v), c = RC.D.counts[t][v];
    if (RC.slotName(t) === 'artist') return `<tr><td class="mist">artist</td><td class="gold">@${esc(name)}</td><td></td></tr>`;
    const k = RC.key(t, v), pts = RC.ptsOf(k) * (t === mods.feature ? 2 : 1);
    return `<tr><td class="mist">${esc(RC.slotName(t))}</td><td>${esc(name)}</td><td>${fmt(c)} <span class="gold">${pts}</span></td></tr>`;
  }).join('');
  openSheet(`
    <div style="display:flex;justify-content:center;padding:0 0 18px">${tile(n, 10)}</div>
    <div class="row"><span class="mid">re:gen #${n}</span><span class="grow"></span><span class="${S.wall[n] ? 'gold' : 'dim'}">${S.wall[n] ? 'on your wall' : 'not on your wall'}</span></div>
    ${RC.isOne(n) ? `<p class="gold" style="margin:9px 0">one of the 18 1 of 1s. art by @${esc(RC.artist(n))}. fits any set.</p>` : ''}
    ${mods.wanted.has(n) ? `<p class="ember" style="margin:9px 0">most wanted this week. +${RC.WANTED_PTS} in a set.</p>` : ''}
    <table class="t" style="margin-top:9px">${rows}</table>
    <p class="dim s9" style="margin:9px 0 0;line-height:13px">how many of the ${fmt(RC.N)} have each trait. gold: points a card in a set${W ? `, ${W.feature} doubled this week` : ''}.</p>
    <div style="margin-top:18px"><button class="btn ghost wide" data-close>close</button></div>`);
}
function openSet(s, who) {
  openSheet(`
    <div class="mist">${who === ME ? 'your set' : `#${G.opp}'s set`}</div>
    <div class="mid" style="margin:9px 0">${traitName(s.k)}</div>
    <p class="mist" style="margin:0 0 9px">${fmt(RC.count(s.k))} of ${fmt(RC.N)} have it. ${s.cards.length} here. <span class="gold">+${s.pts}</span></p>
    <div class="wallgrid">${s.cards.map(n => `<button data-look="${n}">${tile(n, 3)}</button>`).join('')}</div>
    <div style="margin-top:18px"><button class="btn ghost wide" data-close>close</button></div>`);
}
function openSheet(html) { const s = $('#sheet'); $('#sheetIn').innerHTML = html; s.hidden = false; s.classList.remove('up'); void s.offsetWidth; s.classList.add('up'); }
function closeSheet() { $('#sheet').hidden = true; }
$('#sheet').addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'sheet' || t.closest('[data-close]')) return closeSheet();
  const lk = t.closest('[data-look]'); if (lk) return openCard(+lk.dataset.look);
  if (t.closest('[data-again]')) { const lv = G.level; closeSheet(); return startGame(lv); }
  if (t.closest('[data-done]')) return leaveGame();
});
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
addEventListener('resize', () => { if (G.g) renderGame(); });

/* =====================================================================
   BOOT
   ===================================================================== */
const info = RC.init(window.REGEN_DATA);
syncWeek();
$('#kick').textContent = `${fmt(info.N)} re:gens. every trait counts.`;
SHEET.onload = () => { chip(); showTab(location.hash.slice(1) || 'play'); initNet(); };
SHEET.src = window.REGEN_ART;
window.__rc = { G, S, RC, W: () => W, NET, reset() { localStorage.removeItem(KEY); localStorage.removeItem('recollect-v1'); location.reload(); } };
})();

</script>
